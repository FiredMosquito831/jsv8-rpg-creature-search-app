<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RPG Creature Search</title>
</head>
<body>
  <h1>RPG Creature Search</h1>
  <input id="search-input" type="text" placeholder="Search by name or ID" required>
  <button id="search-button">Search</button>

  <div id="creature-info">
    <h2 id="creature-name"></h2>
    <p id="creature-id"></p>
    <p id="weight"></p>
    <p id="height"></p>
    <div id="types"></div>
    <p id="hp"></p>
    <p id="attack"></p>
    <p id="defense"></p>
    <p id="special-attack"></p>
    <p id="special-defense"></p>
    <p id="speed"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
